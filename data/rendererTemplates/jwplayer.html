<!DOCTYPE html>
<html>
    <head>
        <title>jwplayer-template</title>
        <script src='https://cdn.jwplayer.com/libraries/dTFl0VEe.js'></script>
        <script src='../assets/js/jquery-3.7.1.min.js'></script>
        
    </head>
    <body>
        
        <div id="ceres-container" class="ceres-container-jwplayer">
            <div id="jwplayer">
            </div>
        </div>
        
        <script>
            $(document).ready(function() {
                jwplayer('jwplayer').setup({
                "playlist": [{
                "file": "http://example.com/myVideo.mp4",
                "image": "http://example.com/myImage.png",
                    }],
                "height": 360,
                "width": 640
            });
                });
        </script>
    </body>
</html>
