<!DOCTYPE html>
<html>
    <head>
        <title>text-media-template</title>
        
        <link rel="stylesheet" href="http://localhost/Ceres/assets/css/text-media.css" />
        <script src='https://cdn.jwplayer.com/libraries/dTFl0VEe.js'></script>
        <script src='../assets/js/jquery-3.7.1.min.js'></script>
        
    </head>
    <body>

        
        <div id="ceres-container" class="ceres-container ceres-text-media">
            <div id="ceres-container-media" class="ceres-container-media">
            </div>
            <div id="ceres-container-text" class="ceres-container-text">
            </div>
            

        </div>
        
        
        <script>
            $(document).ready(function() {
                jwplayer('jwplayer').setup({
                "playlist": [{
                "file": "http://example.com/myVideo.mp4",
                "image": "http://example.com/myImage.png",
                    }],
                "height": 360,
                "width": 640
            });
                });
        </script>
    </body>
</html>
